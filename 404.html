<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=index.html">
    <title>404 - Page Not Found | Ahmed Ikram</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
            background: #faf8f3;
            color: #1c1917;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        h1 {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 8rem;
            font-weight: 800;
            margin: 0;
            color: #c2410c;
        }
        p {
            font-size: 1.5rem;
            margin: 1rem 0 2rem;
            color: rgba(28, 25, 23, 0.65);
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #c2410c;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 8px rgba(194, 65, 12, 0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            background: #a3360a;
            box-shadow: 0 4px 16px rgba(194, 65, 12, 0.25);
        }
        .timer {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <a href="index.html" class="btn">Return Home</a>
    <div class="timer">Redirecting in 5 seconds...</div>
    <script src="assets/js/main.js?v=4.5" defer></script>
</body>
</html>
